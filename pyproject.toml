[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geocene-export"
version = "0.1.0"
description = "Download Geocene mission and event exports from the command line."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.3,<3"]

[project.urls]
Repository = "https://github.com/Geocene/geocene-export"

[project.scripts]
geocene-export = "geocene_export.cli:main"

[tool.setuptools.packages.find]
include = ["geocene_export*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
# Exact type checks prevent JSON booleans from being accepted as integer IDs.
ignore = ["E721"]
